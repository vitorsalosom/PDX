<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDX — Pagode do Xandó | Caraíva - BA</title>
  <meta name="description" content="O pagode mais feliz do Brasil. Toda semana em Caraíva-BA, com edições especiais em SP, BH, Vitória e Arraial d'Ajuda.">
  <meta property="og:title" content="PDX — Pagode do Xandó | Caraíva - BA">
  <meta property="og:description" content="O pagode mais feliz do Brasil. Seja feliz em Caraíva!">
  <meta property="og:image" content="assets/img/hero-1.webp">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#8338EC">
  <link rel="icon" type="image/png" href="assets/img/logo-escura.png">
  <link rel="preload" href="assets/fonts/Spot-Normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Brasilero2018Free.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <!-- Navegação -->
  <nav id="nav" class="nav">
    <a href="#hero" class="nav__logo" aria-label="PDX - Início">
      <img src="assets/img/logo-clara.png" alt="PDX - Pagode do Xandó, Caraíva">
    </a>
    <ul id="nav-menu" class="nav__menu"></ul>
    <div class="nav__acoes">
      <button id="nav-play" class="nav__play" aria-label="Ouvir a playlist do PDX" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.28c-.24.36-.66.48-1.02.24-2.82-1.74-6.36-2.1-10.56-1.14-.42.12-.78-.18-.9-.54-.12-.42.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.3 1.02zm1.44-3.3c-.3.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.38-.48.12-1.02-.12-1.14-.6-.12-.48.12-1.02.6-1.14 4.38-1.32 9.78-.66 13.5 1.62.36.18.54.78.24 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.28 9.3c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.14-1.26 11.16-1.02 15.54 1.62.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.5.24z"/></svg>
        <span class="nav__play-texto">Ouvir</span>
      </button>
      <button id="nav-burger" class="nav__burger" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mini player da playlist (carrega só quando aberto) -->
  <div id="player" class="player" hidden>
    <div class="player__topo">
      <span class="player__titulo">Playlist do PDX</span>
      <div class="player__acoes">
        <button class="player__minimizar" aria-label="Minimizar sem parar a música" title="Minimizar (a música continua)">&minus;</button>
        <button class="player__fechar" aria-label="Fechar e parar a música" title="Fechar e parar">&times;</button>
      </div>
    </div>
    <div class="player__caixa"></div>
  </div>

  <!-- Seções renderizadas via content/site.json -->
  <main id="app" aria-live="polite"></main>

  <!-- Rodapé -->
  <footer class="footer">
    <img src="assets/img/logo-clara.png" alt="PDX - Pagode do Xandó, Caraíva" class="footer__logo">
    <p class="footer__tagline" id="footer-tagline">Seja feliz em Caraíva!</p>
    <div class="footer__social" id="footer-social"></div>
    <div class="footer__contratar" id="footer-contratar"></div>
    <p class="footer__credits">© <span id="footer-year"></span> Pagode do Xandó — Caraíva, Bahia</p>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-hidden="true">
    <button class="lightbox__close" aria-label="Fechar">&times;</button>
    <button class="lightbox__prev" aria-label="Anterior">&#8249;</button>
    <img src="" alt="">
    <button class="lightbox__next" aria-label="Próxima">&#8250;</button>
    <p class="lightbox__caption"></p>
  </div>

  <!-- Botão WhatsApp flutuante -->
  <a id="whats-float" class="whats-float" href="#" target="_blank" rel="noopener" aria-label="Fale conosco no WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script src="js/content-fallback.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
